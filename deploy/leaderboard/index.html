<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PCT GeoGuesser — Leaderboard</title>
<meta name="description" content="PCT GeoGuesser leaderboard — see the top scores on the Pacific Crest Trail guessing game.">
<!-- Open Graph / social preview -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://pct-geoguesser.economicurtis.com/leaderboard/">
<meta property="og:title"       content="PCT GeoGuesser">
<meta property="og:description" content="How well do you know the PCT?">
<meta property="og:image"       content="https://pct-geoguesser.economicurtis.com/misc/preview.png">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="PCT GeoGuesser">
<meta name="twitter:description" content="How well do you know the PCT?">
<meta name="twitter:image"       content="https://pct-geoguesser.economicurtis.com/misc/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://pct-geoguesser.economicurtis.com/misc/pct-geoguesser-favicon.png">
<link rel="apple-touch-icon" href="https://pct-geoguesser.economicurtis.com/misc/pct-geoguesser-favicon.png">
<meta name="theme-color" content="#0d1117">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #f0f6fc;
  --muted:     #8b949e;
  --pct-green: #1D502E;
  --pct-teal:  #008080;
  --pct-white: #FFFFFF;
  /* ── Font preference (overridden at runtime if site_settings primary_font
        is set to 'open-sans'). Default: Futura stack. ── */
  --font-primary: 'Futura', 'Futura PT', 'Open Sans', Arial, sans-serif;
}

body {
  font-family: var(--font-primary);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}

.top-nav {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.back-link {
  color: var(--pct-teal);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 16px 48px;
}

.page-header {
  padding: 28px 0 16px;
  text-align: center;
}
.page-header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: var(--pct-white);
}

/* Tab bar — hidden by default, shown only when 90-day is enabled */
.tab-bar {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 10px 16px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: var(--muted);
  background: var(--surface);
  border: none;
  transition: background .15s, color .15s;
}
.tab:hover:not(.tab-active) { background: var(--surface2); color: var(--text); }
.tab.tab-active {
  background: var(--pct-green);
  color: var(--pct-white);
  cursor: default;
}

.state-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 15px;
}
.state-msg .spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--pct-teal);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.lb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.lb-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.lb-table td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.lb-table tr:last-child td { border-bottom: none; }
.lb-table tbody tr:hover { background: var(--surface2); }
/* Highlight the logged-in player's own row */
.lb-row-me {
  background: rgba(0, 128, 128, 0.10);
  border-left: 3px solid var(--pct-teal);
}
.lb-row-me:hover { background: rgba(0, 128, 128, 0.18); }

.rank-cell {
  font-size: 16px;
  text-align: center;
  width: 44px;
  color: var(--muted);
  font-weight: 700;
}
.rank-medal { font-size: 20px; }
.name-cell { min-width: 140px; }
.hiker-link {
  color: var(--pct-teal);
  font-weight: 700;
  text-decoration: none;
  font-size: 15px;
}
.hiker-link:hover { text-decoration: underline; color: #5fd4d4; }
.pct-year {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.score-cell {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.perf-cell {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.perf-cell.all-perfect {
  color: var(--pct-teal);
  font-weight: 700;
}
.window-note {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 16px;
}

@media (min-width: 600px) {
  .lb-table { font-size: 15px; }
  .lb-table th { font-size: 12px; padding: 10px 16px; }
  .lb-table td { padding: 14px 16px; }
  .hiker-link { font-size: 16px; }
}
</style>
<script>
(function() {
  var STACKS = {
    'futura':    "'Futura', 'Futura PT', 'Open Sans', Arial, sans-serif",
    'open-sans': "'Open Sans', Arial, sans-serif"
  };
  function apply(val) {
    if (!STACKS[val]) return;
    document.documentElement.style.setProperty('--font-primary', STACKS[val]);
    try { localStorage.setItem('pct_font', val); } catch (_) {}
  }
  try { apply(localStorage.getItem('pct_font')); } catch (_) {}
  fetch('https://firestore.googleapis.com/v1/projects/pct-geoguesser-9d535/databases/(default)/documents/site_settings/primary_font?key=AIzaSyD8HreF5tpB1sC_8w09V5g1IV2-O95uG54')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d && d.fields && d.fields.value) apply(d.fields.value.stringValue); })
    .catch(function() {});
})();
</script>
</head>
<body>

<nav style="border-bottom:1px solid var(--border)">
  <div class="top-nav">
    <a href="/" class="back-link">← PCT GeoGuesser</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1 id="lb-title">Leaderboard</h1>
  </div>

  <!-- Tab bar: hidden until 90-day setting is confirmed enabled -->
  <div class="tab-bar" id="tab-bar" style="display:none">
    <button class="tab" id="tab-alltime">All-Time</button>
    <button class="tab" id="tab-rolling">90-Day</button>
  </div>

  <p class="window-note" id="window-note"></p>

  <div id="state-loading" class="state-msg">
    <div class="spinner"></div><br>Loading scores…
  </div>
  <div id="state-empty" class="state-msg" hidden>No scores yet — be the first!</div>
  <div id="state-error" class="state-msg" hidden>
    <div style="font-size:32px;margin-bottom:12px">⛺</div>
    <div id="error-msg" style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px">Leaderboard temporarily unavailable</div>
    <div style="margin-bottom:20px">The server may be resting — try again in a minute.</div>
    <a href="https://forms.gle/LSnZgRYr5yHG3AhR8" target="_blank" rel="noopener"
       style="color:var(--pct-teal);font-size:13px;text-decoration:underline">Report an issue ↗</a>
  </div>

  <table id="lb-table" class="lb-table" hidden>
    <thead>
      <tr>
        <th style="text-align:center">#</th>
        <th>Trail Name</th>
        <th>Best Score</th>
        <th>Perfects</th>
      </tr>
    </thead>
    <tbody id="lb-body"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const app  = initializeApp({"apiKey": "AIzaSyD8HreF5tpB1sC_8w09V5g1IV2-O95uG54", "authDomain": "pct-geoguesser-9d535.firebaseapp.com", "projectId": "pct-geoguesser-9d535", "storageBucket": "pct-geoguesser-9d535.firebasestorage.app", "messagingSenderId": "89928482559", "appId": "1:89928482559:web:e3e055af16a7417e10d6ca"});
const auth = getAuth(app);
const db   = getFirestore(app);
const MEDALS = ['🥇','🥈','🥉'];

// Current view: 'alltime' (default) or 'rolling'
let currentView = 'alltime';
// Logged-in user's ID — set in init(); null if not signed in
let currentUserId = null;

// trail_name / pct_year are player-entered, so escape before innerHTML
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function showState(id) {
  ['state-loading','state-empty','state-error','lb-table']
    .forEach(s => document.getElementById(s).hidden = (s !== id));
}

function switchView(view) {
  currentView = view;
  document.getElementById('tab-alltime').classList.toggle('tab-active', view === 'alltime');
  document.getElementById('tab-rolling').classList.toggle('tab-active', view === 'rolling');
  loadScores();
}

// Returns sessions sorted by total_score DESC
async function fetchSessions() {
  const sessions = collection(db, 'game_sessions');
  if (currentView === 'rolling') {
    // Firestore can't order by a different field than the range filter, so sort here
    const cutoff = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000);
    const snap = await getDocs(query(sessions, where('played_at', '>=', cutoff)));
    return snap.docs.map(d => d.data()).sort((a, b) => b.total_score - a.total_score);
  }
  const snap = await getDocs(query(sessions, orderBy('total_score', 'desc'), limit(500)));
  return snap.docs.map(d => d.data());
}

async function loadScores() {
  showState('state-loading');
  try {
    const sessions = await fetchSessions();

    // Keep only the best score per user (already sorted DESC, first hit = best)
    const seen = new Set();
    const best = [];
    for (const s of sessions) {
      if (seen.has(s.user_id)) continue;
      seen.add(s.user_id);
      best.push(s);
      if (best.length >= 100) break;
    }

    const profileSnaps = await Promise.all(best.map(s => getDoc(doc(db, 'profiles', s.user_id))));
    const rows = [];
    best.forEach((s, i) => {
      if (profileSnaps[i].exists()) rows.push({ ...s, profile: profileSnaps[i].data() });
    });

    if (rows.length === 0) { showState('state-empty'); return; }

    document.getElementById('window-note').textContent = currentView === 'rolling'
      ? 'Highest score per player in the last 90 days · max 2655.8 pts'
      : 'Highest score per player, all time · max 2655.8 pts';

    const tbody = document.getElementById('lb-body');
    tbody.innerHTML = '';
    rows.forEach((row, i) => {
      const rank      = i + 1;
      const profileId = encodeURIComponent(row.user_id);
      const name      = esc(row.profile.trail_name || 'Anonymous');
      const pctYear   = esc(row.profile.pct_year   || '');
      const score     = Number(row.total_score).toFixed(1);
      const perfects  = row.perfect_count ?? 0;
      const total     = row.photo_count   ?? 10;
      const allPerf   = perfects === total;

      const rankHtml = rank <= 3
        ? `<span class="rank-medal">${MEDALS[rank-1]}</span>`
        : `${rank}`;
      const yearHtml = pctYear
        ? `<span class="pct-year">PCT ${pctYear}</span>`
        : '';

      const tr = document.createElement('tr');
      // Highlight the current player's own row
      if (currentUserId && row.user_id === currentUserId) {
        tr.classList.add('lb-row-me');
      }
      tr.innerHTML = `
        <td class="rank-cell">${rankHtml}</td>
        <td class="name-cell">
          <a href="/hiker/?id=${profileId}" class="hiker-link">${name}</a>
          ${yearHtml}
        </td>
        <td class="score-cell">${score} pts</td>
        <td class="perf-cell${allPerf ? ' all-perfect' : ''}">${perfects}/${total}</td>
      `;
      tbody.appendChild(tr);
    });

    showState('lb-table');
  } catch (err) {
    // Firestore errors (offline, permission-denied) aren't meaningful to
    // players; keep the friendly default message and log the detail.
    console.error('Leaderboard load failed:', err);
    showState('state-error');
  }
}

async function init() {
  document.getElementById('tab-alltime').addEventListener('click', () => switchView('alltime'));
  document.getElementById('tab-rolling').addEventListener('click', () => switchView('rolling'));

  // Identify the logged-in player (if any) so their row can be highlighted.
  // The first onAuthStateChanged callback fires once the saved session is restored.
  const userReady = new Promise(resolve => {
    const unsub = onAuthStateChanged(auth, user => {
      currentUserId = user ? user.uid : null;
      unsub();
      resolve();
    }, () => resolve());
  });

  let rollingEnabled = false;
  try {
    const snap = await getDoc(doc(db, 'site_settings', 'show_rolling_leaderboard'));
    rollingEnabled = snap.exists() && snap.data().value === 'true';
  } catch (_) {}

  if (rollingEnabled) {
    document.getElementById('tab-bar').style.display = '';
    document.getElementById('lb-title').textContent = 'All-Time Leaderboard';
    document.getElementById('tab-alltime').classList.add('tab-active');
  } else {
    document.getElementById('lb-title').textContent = 'Leaderboard';
  }

  currentView = 'alltime';
  await userReady;
  loadScores();
}

init();
</script>
</body>
</html>
