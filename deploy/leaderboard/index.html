<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PCT GeoGuesser — Leaderboard</title>
<meta name="description" content="PCT GeoGuesser leaderboard — see the top scores on the Pacific Crest Trail guessing game.">
<!-- Open Graph / social preview -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://pct-geoguesser.economicurtis.com/leaderboard/">
<meta property="og:title"       content="PCT GeoGuesser">
<meta property="og:description" content="How well do you know the PCT?">
<meta property="og:image"       content="https://pct-geoguesser.economicurtis.com/misc/preview.png">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="PCT GeoGuesser">
<meta name="twitter:description" content="How well do you know the PCT?">
<meta name="twitter:image"       content="https://pct-geoguesser.economicurtis.com/misc/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://pct-geoguesser.economicurtis.com/misc/pct-geoguesser-favicon.png">
<link rel="apple-touch-icon" href="https://pct-geoguesser.economicurtis.com/misc/pct-geoguesser-favicon.png">
<meta name="theme-color" content="#0d1117">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #f0f6fc;
  --muted:     #8b949e;
  --pct-green: #1D502E;
  --pct-teal:  #008080;
  --pct-white: #FFFFFF;
  /* ── Font preference (overridden at runtime if site_settings primary_font
        is set to 'open-sans'). Default: Futura stack. ── */
  --font-primary: 'Futura', 'Futura PT', 'Open Sans', Arial, sans-serif;
}

body {
  font-family: var(--font-primary);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}

.top-nav {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.back-link {
  color: var(--pct-teal);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 16px 48px;
}

.page-header {
  padding: 28px 0 16px;
  text-align: center;
}
.page-header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: var(--pct-white);
}

/* Tab bars: Official / Guests, then All-Time / 90-Day (only when enabled) */
.tab-bar {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 10px 16px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: var(--muted);
  background: var(--surface);
  border: none;
  transition: background .15s, color .15s;
}
.tab:hover:not(.tab-active) { background: var(--surface2); color: var(--text); }
.tab.tab-active {
  background: var(--pct-green);
  color: var(--pct-white);
  cursor: default;
}
.tab-bar.tab-bar-sub { margin-top: -12px; }
.tab-bar-sub .tab { padding: 7px 12px; font-size: 13px; }
.tab-bar-sub .tab.tab-active { background: var(--surface2); color: var(--text); }

.state-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 15px;
}
.state-msg .spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--pct-teal);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.lb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.lb-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.lb-table td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.lb-table tr:last-child td { border-bottom: none; }
.lb-table tbody tr:hover { background: var(--surface2); }
/* Highlight the logged-in player's own row */
.lb-row-me {
  background: rgba(0, 128, 128, 0.10);
  border-left: 3px solid var(--pct-teal);
}
.lb-row-me:hover { background: rgba(0, 128, 128, 0.18); }

.rank-cell {
  font-size: 16px;
  text-align: center;
  width: 44px;
  color: var(--muted);
  font-weight: 700;
}
.rank-medal { font-size: 20px; }
.name-cell { min-width: 140px; }
.hiker-link {
  color: var(--pct-teal);
  font-weight: 700;
  text-decoration: none;
  font-size: 15px;
}
.hiker-link:hover { text-decoration: underline; color: #5fd4d4; }
/* Guests have no /hiker/ page, so their names aren't links */
.guest-name { color: var(--text); font-weight: 700; font-size: 15px; }
.pct-year {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.score-cell {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.perf-cell {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.perf-cell.all-perfect {
  color: var(--pct-teal);
  font-weight: 700;
}
.window-note {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 16px;
}

@media (min-width: 600px) {
  .lb-table { font-size: 15px; }
  .lb-table th { font-size: 12px; padding: 10px 16px; }
  .lb-table td { padding: 14px 16px; }
  .hiker-link { font-size: 16px; }
}
</style>
<script>
(function() {
  var STACKS = {
    'futura':    "'Futura', 'Futura PT', 'Open Sans', Arial, sans-serif",
    'open-sans': "'Open Sans', Arial, sans-serif"
  };
  function apply(val) {
    if (!STACKS[val]) return;
    document.documentElement.style.setProperty('--font-primary', STACKS[val]);
    try { localStorage.setItem('pct_font', val); } catch (_) {}
  }
  try { apply(localStorage.getItem('pct_font')); } catch (_) {}
  fetch('https://firestore.googleapis.com/v1/projects/pct-geoguesser-9d535/databases/(default)/documents/site_settings/primary_font?key=AIzaSyD8HreF5tpB1sC_8w09V5g1IV2-O95uG54')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d && d.fields && d.fields.value) apply(d.fields.value.stringValue); })
    .catch(function() {});
})();
</script>
</head>
<body>

<nav style="border-bottom:1px solid var(--border)">
  <div class="top-nav">
    <a href="/" class="back-link">← PCT GeoGuesser</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1 id="lb-title">Leaderboard</h1>
  </div>

  <div class="tab-bar" id="tier-bar">
    <button class="tab" id="tab-official">Official</button>
    <button class="tab" id="tab-guests">Guests</button>
  </div>

  <!-- Hidden until the 90-day setting is confirmed enabled -->
  <div class="tab-bar tab-bar-sub" id="tab-bar" style="display:none">
    <button class="tab" id="tab-alltime">All-Time</button>
    <button class="tab" id="tab-rolling">90-Day</button>
  </div>

  <p class="window-note" id="window-note"></p>

  <div id="state-loading" class="state-msg">
    <div class="spinner"></div><br>Loading scores…
  </div>
  <div id="state-empty" class="state-msg" hidden>No scores yet — <a id="empty-link" href="/game/" style="color:var(--pct-teal)">be the first!</a></div>
  <div id="state-error" class="state-msg" hidden>
    <div style="font-size:32px;margin-bottom:12px">⛺</div>
    <div id="error-msg" style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px">Leaderboard temporarily unavailable</div>
    <div style="margin-bottom:20px">The server may be resting — try again in a minute.</div>
    <a href="https://forms.gle/LSnZgRYr5yHG3AhR8" target="_blank" rel="noopener"
       style="color:var(--pct-teal);font-size:13px;text-decoration:underline">Report an issue ↗</a>
  </div>

  <table id="lb-table" class="lb-table" hidden>
    <thead>
      <tr>
        <th style="text-align:center">#</th>
        <th>Trail Name</th>
        <th>Best Score</th>
        <th>Perfects</th>
      </tr>
    </thead>
    <tbody id="lb-body"></tbody>
  </table>
</div>

<script>
// Plain Firestore REST calls (no Firebase SDK): the SDK is ~245 KB and opens
// a live connection, which made first visits on phones take many seconds.
const REST = 'https://firestore.googleapis.com/v1/projects/pct-geoguesser-9d535/databases/(default)/documents';
const KEY  = 'AIzaSyD8HreF5tpB1sC_8w09V5g1IV2-O95uG54';
const DOC_PREFIX = REST.replace('https://firestore.googleapis.com/v1/', '');
const MEDALS = ['🥇','🥈','🥉'];

// Boards: collections, the localStorage key the game page stores the player's
// uid under, and Firebase Auth's app name (for the IndexedDB fallback)
const TIERS = {
  official: { profiles: 'profiles',       sessions: 'game_sessions',  uidKey: 'pct_uid',       app: '[DEFAULT]', play: '/game/'  },
  guests:   { profiles: 'guest_profiles', sessions: 'guest_sessions', uidKey: 'pct_guest_uid', app: 'guest',     play: '/guest/' },
};

// Current board ('official' | 'guests') and view ('alltime' | 'rolling')
let currentTier = new URLSearchParams(location.search).get('board') === 'guests' ? 'guests' : 'official';
let currentView = 'alltime';
// Signed-in player's uid per board (for row highlighting); null if unknown
const myUid = { official: null, guests: null };

// trail_name / pct_year are player-entered, so escape before innerHTML
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// localStorage can be missing or throw (private mode); it's only a speed-up
function cacheGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; }
}
function cacheSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
}

// Firestore REST returns typed values; whole numbers come back as integerValue
function plain(v) {
  if (!v) return null;
  if ('stringValue'  in v) return v.stringValue;
  if ('doubleValue'  in v) return v.doubleValue;
  if ('integerValue' in v) return Number(v.integerValue);
  return null;
}
function docData(d) {
  const out = { id: d.name.split('/').pop() };
  for (const [k, v] of Object.entries(d.fields || {})) out[k] = plain(v);
  return out;
}

async function post(method, body) {
  const res = await fetch(`${REST}:${method}?key=${KEY}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`${method} failed: ${res.status}`);
  return res.json();
}
const fieldList = names => ({ fields: names.map(n => ({ fieldPath: n })) });

// All-time: each profile carries its best game (kept up to date by the game
// page and checked by firestore.rules), so this is a single query.
async function fetchAllTime(tier) {
  const res = await post('runQuery', { structuredQuery: {
    from:    [{ collectionId: TIERS[tier].profiles }],
    select:  fieldList(['trail_name', 'pct_year', 'best_score', 'best_perfects']),
    orderBy: [{ field: { fieldPath: 'best_score' }, direction: 'DESCENDING' }],
    limit:   100,
  } });
  return res.filter(r => r.document).map(r => docData(r.document)).map(p => ({
    user_id: p.id, name: p.trail_name, year: p.pct_year, score: p.best_score, perfects: p.best_perfects ?? 0,
  }));
}

// 90-day: best game per player among recent sessions, then their names
async function fetchRolling(tier) {
  const cutoff = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString();
  const res = await post('runQuery', { structuredQuery: {
    from:   [{ collectionId: TIERS[tier].sessions }],
    select: fieldList(['user_id', 'total_score', 'perfect_count']),
    where:  { fieldFilter: { field: { fieldPath: 'played_at' }, op: 'GREATER_THAN_OR_EQUAL', value: { timestampValue: cutoff } } },
  } });
  const sessions = res.filter(r => r.document).map(r => docData(r.document))
    .sort((a, b) => b.total_score - a.total_score);
  const seen = new Set();
  const best = [];
  for (const s of sessions) {
    if (seen.has(s.user_id)) continue;
    seen.add(s.user_id);
    best.push(s);
    if (best.length >= 100) break;
  }
  if (!best.length) return [];
  const got = await post('batchGet', {
    documents: best.map(s => `${DOC_PREFIX}/${TIERS[tier].profiles}/${s.user_id}`),
    mask: { fieldPaths: ['trail_name', 'pct_year'] },
  });
  const profiles = {};
  got.filter(r => r.found).forEach(r => { const p = docData(r.found); profiles[p.id] = p; });
  return best.filter(s => profiles[s.user_id]).map(s => ({
    user_id: s.user_id, name: profiles[s.user_id].trail_name, year: profiles[s.user_id].pct_year,
    score: s.total_score, perfects: s.perfect_count ?? 0,
  }));
}

function showState(id) {
  ['state-loading','state-empty','state-error','lb-table']
    .forEach(s => document.getElementById(s).hidden = (s !== id));
}

function render(rows) {
  const guests = currentTier === 'guests';
  document.getElementById('window-note').textContent =
    (currentView === 'rolling' ? 'Highest score per player in the last 90 days' : 'Highest score per player, all time')
    + (guests ? ' · unofficial, played without signing in' : ' · max 2655.8 pts');
  if (rows.length === 0) {
    document.getElementById('empty-link').href = TIERS[currentTier].play;
    showState('state-empty');
    return;
  }

  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = '';
  rows.forEach((row, i) => {
    const rank      = i + 1;
    const profileId = encodeURIComponent(row.user_id);
    const name      = esc(row.name || 'Anonymous');
    const pctYear   = esc(row.year || '');
    const score     = Number(row.score).toFixed(1);
    const perfects  = row.perfects;
    const allPerf   = perfects === 10;

    const rankHtml = rank <= 3
      ? `<span class="rank-medal">${MEDALS[rank-1]}</span>`
      : `${rank}`;
    const yearHtml = pctYear
      ? `<span class="pct-year">PCT ${pctYear}</span>`
      : '';

    const tr = document.createElement('tr');
    tr.dataset.uid = row.user_id;
    tr.innerHTML = `
      <td class="rank-cell">${rankHtml}</td>
      <td class="name-cell">
        ${guests ? `<span class="guest-name">${name}</span>` : `<a href="/hiker/?id=${profileId}" class="hiker-link">${name}</a>`}
        ${yearHtml}
      </td>
      <td class="score-cell">${score} pts</td>
      <td class="perf-cell${allPerf ? ' all-perfect' : ''}">${perfects}/10</td>
    `;
    tbody.appendChild(tr);
  });
  highlightMe();
  showState('lb-table');
}

// Highlight the current player's own row
function highlightMe() {
  const uid = myUid[currentTier];
  if (!uid) return;
  document.querySelectorAll('#lb-body tr').forEach(tr =>
    tr.classList.toggle('lb-row-me', tr.dataset.uid === uid));
}

// Only players with both a trail name and a PCT year are listed (the rules
// require both for new profiles; this also covers older imported data)
const listed = rows => rows.filter(r => (r.name || '').trim() && (r.year || '').trim());

// Draw the last copy this browser saw straight away, then swap in fresh data
async function loadScores() {
  const tier = currentTier, view = currentView;
  const isCurrent = () => tier === currentTier && view === currentView;
  const cacheKey = `pct_lb_${tier}_${view}`;
  const cached = cacheGet(cacheKey);
  if (cached) render(cached);
  else showState('state-loading');
  try {
    const rows = listed(await (view === 'rolling' ? fetchRolling(tier) : fetchAllTime(tier)));
    cacheSet(cacheKey, rows);
    if (isCurrent()) render(rows);
  } catch (err) {
    // Keep showing the cached copy if there is one; the error detail isn't
    // meaningful to players, so it only goes to the console.
    console.error('Leaderboard load failed:', err);
    if (!cached && isCurrent()) showState('state-error');
  }
}

function applyRollingSetting(enabled) {
  document.getElementById('tab-bar').style.display = enabled ? '' : 'none';
}

async function loadRollingSetting() {
  try {
    const res = await fetch(`${REST}/site_settings/show_rolling_leaderboard?key=${KEY}`);
    const enabled = res.ok && plain((await res.json()).fields?.value) === 'true';
    cacheSet('pct_lb_rolling_on', enabled);
    applyRollingSetting(enabled);
  } catch (_) {}
}

// The game pages store the uid in localStorage on sign-in. Players who signed
// in before that existed: read it from Firebase Auth's own IndexedDB record
// (key 'firebase:authUser:<apiKey>:<appName>').
function readFirebaseUid(appName) {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open('firebaseLocalStorageDb');
      req.onupgradeneeded = () => req.transaction.abort();  // not signed in here; don't create the DB
      req.onerror = () => resolve(null);
      req.onsuccess = () => {
        const idb = req.result;
        try {
          const all = idb.transaction('firebaseLocalStorage').objectStore('firebaseLocalStorage').getAll();
          all.onsuccess = () => {
            const hit = all.result.find(r => String(r.fbase_key).startsWith('firebase:authUser:')
                                          && String(r.fbase_key).endsWith(':' + appName));
            resolve(hit?.value?.uid ?? null);
            idb.close();
          };
          all.onerror = () => { resolve(null); idb.close(); };
        } catch (_) { resolve(null); idb.close(); }
      };
    } catch (_) { resolve(null); }
  });
}

async function findMe() {
  for (const [tier, t] of Object.entries(TIERS)) {
    try { myUid[tier] = localStorage.getItem(t.uidKey); } catch (_) {}
    if (!myUid[tier]) {
      myUid[tier] = await readFirebaseUid(t.app);
      if (myUid[tier]) try { localStorage.setItem(t.uidKey, myUid[tier]); } catch (_) {}
    }
  }
  highlightMe();
}

function switchTier(tier) {
  currentTier = tier;
  document.getElementById('tab-official').classList.toggle('tab-active', tier === 'official');
  document.getElementById('tab-guests').classList.toggle('tab-active', tier === 'guests');
  // Keep the address shareable (?board=guests)
  try { history.replaceState(null, '', tier === 'guests' ? '?board=guests' : location.pathname); } catch (_) {}
  loadScores();
}

function switchView(view) {
  currentView = view;
  document.getElementById('tab-alltime').classList.toggle('tab-active', view === 'alltime');
  document.getElementById('tab-rolling').classList.toggle('tab-active', view === 'rolling');
  loadScores();
}

document.getElementById('tab-official').addEventListener('click', () => switchTier('official'));
document.getElementById('tab-guests').addEventListener('click', () => switchTier('guests'));
document.getElementById('tab-alltime').addEventListener('click', () => switchView('alltime'));
document.getElementById('tab-rolling').addEventListener('click', () => switchView('rolling'));
document.getElementById('tab-alltime').classList.add('tab-active');
applyRollingSetting(cacheGet('pct_lb_rolling_on') === true);
switchTier(currentTier);
loadRollingSetting();
findMe();
</script>
</body>
</html>
