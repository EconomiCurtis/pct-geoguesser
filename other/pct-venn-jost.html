<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCT × GeoGuessr</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@600&display=swap');
  :root {
    --pct-green: #1D502E;
    --pct-teal:  #008080;
    --pct-blue:  #2E7DBF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
  }
  .sign-outer { background: #111; border-radius: 32px; padding: 5px; box-shadow: 0 16px 56px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.5); }
  .sign-gap   { background: #fff; border-radius: 28px; padding: 4px; }
  .sign-ring  { background: #111; border-radius: 25px; padding: 3px; }
  .sign-body  {
    background: #fff;
    border-radius: 23px;
    padding: 28px 36px;
    width: min(560px, 90vw);
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .header-text, .footer-text {
    font-family: 'Jost', 'Futura PT Demi', 'Futura PT', 'Futura', 'Century Gothic', sans-serif;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: black;
    text-align: center;
    font-size: clamp(17px, 4.6vw, 23px);
  }
  .arrow-wrap { display: flex; justify-content: center; margin: 6px 0 2px; }
  .venn-wrap { width: 100%; }
  .venn-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .footer-text { margin-top: 60px; }

</style>
</head>
<body>

<!-- ── Main sign ──────────────────────────────────────── -->
<div class="sign-outer"><div class="sign-gap"><div class="sign-ring">
  <div class="sign-body">

    <p class="header-text">Is this you?</p>

    <div class="arrow-wrap">
      <svg width="22" height="52" viewBox="0 0 22 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="11" y1="2" x2="11" y2="49" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
        <polyline points="3,33 11,49 19,33" fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="venn-wrap">
      <svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="lensClip">
            <circle cx="151" cy="140" r="125"/>
          </clipPath>
          <radialGradient id="fillL" cx="38%" cy="50%" r="65%">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#f5faf7"/>
            <stop offset="100%" stop-color="#e2f0e8"/>
          </radialGradient>
          <radialGradient id="fillR" cx="62%" cy="50%" r="65%">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#e4f0fa"/>
            <stop offset="100%" stop-color="#c8dff5"/>
          </radialGradient>
          <!-- Option A: r=1, 6px grid, 45° diagonal -->
          <pattern id="dotLmain" x="0" y="0" width="6" height="6"
                   patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <circle cx="3" cy="3" r="1" fill="#1D502E" opacity="0.11"/>
          </pattern>
          <pattern id="dotRmain" x="0" y="0" width="6" height="6"
                   patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <circle cx="3" cy="3" r="1" fill="#2E7DBF" opacity="0.11"/>
          </pattern>
        </defs>

        <circle cx="151" cy="140" r="125" fill="url(#fillL)" stroke="#1D502E" stroke-width="1.7"/>
        <circle cx="151" cy="140" r="125" fill="url(#dotLmain)" stroke="none"/>

        <circle cx="369" cy="140" r="125" fill="url(#fillR)" stroke="#1A4A72" stroke-width="1.7"/>
        <circle cx="369" cy="140" r="125" fill="url(#dotRmain)" stroke="none"/>

        <circle cx="369" cy="140" r="125" clip-path="url(#lensClip)" fill="#008080"/>

        <circle cx="151" cy="140" r="125" fill="none" stroke="#1D502E" stroke-width="1.7"/>
        <circle cx="369" cy="140" r="125" fill="none" stroke="#1A4A72" stroke-width="1.7"/>

        <text x="145" y="130" text-anchor="middle" dominant-baseline="central"
          font-family="'Jost','Futura PT Demi','Futura PT','Futura','Century Gothic',sans-serif"
          font-weight="600" font-size="23" letter-spacing="1.5" fill="black">PCT</text>
        <text x="145" y="152" text-anchor="middle" dominant-baseline="central"
          font-family="'Jost','Futura PT Demi','Futura PT','Futura','Century Gothic',sans-serif"
          font-weight="600" font-size="23" letter-spacing="1.5" fill="black">HIKER</text>

        <text x="375" y="130" text-anchor="middle" dominant-baseline="central"
          font-family="'Jost','Futura PT Demi','Futura PT','Futura','Century Gothic',sans-serif"
          font-weight="600" font-size="23" letter-spacing="1.5" fill="black">GEOGUESSR</text>
        <text x="375" y="152" text-anchor="middle" dominant-baseline="central"
          font-family="'Jost','Futura PT Demi','Futura PT','Futura','Century Gothic',sans-serif"
          font-weight="600" font-size="23" letter-spacing="1.5" fill="black">FAN</text>
      </svg>
    </div>

    <p class="footer-text">Then you're going to enjoy this</p>
  </div>
</div></div></div>


</body></html>
