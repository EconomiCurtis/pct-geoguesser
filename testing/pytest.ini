[pytest]
testpaths =
    unit
    data
    integration
    browser
python_files = test_*.py
addopts = -ra
markers =
    unit: fast tests of isolated Python utilities
    data: contracts for the photo catalog
    integration: tests that run real project scripts in temporary copies
    browser: Chromium tests of generated pages and browser-side game logic
    staging: future tests that may write only to a dedicated staging backend

